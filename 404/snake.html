<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Snake</title>
  <style>
    :root {
      --text: #888;
      --border: #888;
      --bg: transparent;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      touch-action: none;
    }
    h1 { margin: 0; font-size: 2rem; letter-spacing: .1em; }
    p { margin: 0; font-size: .85rem; }
    canvas {
      background: transparent;
      border: 2px solid var(--border);
      border-radius: 8px;
      max-width: 92vw;
      max-height: 70vh;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found. Play some snake instead.</p>
  <canvas id="c" width="320" height="320"></canvas>
  <p id="info">Score: 0 · Press an arrow key / swipe to start</p>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const info = document.getElementById('info');
  const CELL = 16;

  // Style/config via URL params, e.g. ?snake=ff0000&food=ffff00&speed=80&grid=24&title=0
  // Colors: hex without '#' (ff0000, f00) or any CSS color name/function (encoded).
  const params = new URLSearchParams(location.search);
  const color = (key, fallback) => {
    let v = (params.get(key) || '').trim();
    if (/^([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) v = '#' + v;
    return v && CSS.supports('color', v) ? v : fallback;
  };
  const num = (key, fallback, min, max) => {
    const n = parseInt(params.get(key), 10);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
  };
  const off = key => ['0', 'false', 'no'].includes(params.get(key));

  const SNAKE_COLOR = color('snake', '#22c55e');
  const FOOD_COLOR = color('food', '#ef4444');
  const SPEED = num('speed', 110, 30, 500); // ms per tick
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--text', color('text', '#888'));
  rootStyle.setProperty('--border', color('border', '#888'));
  rootStyle.setProperty('--bg', color('bg', 'transparent'));
  if (off('title')) document.querySelector('h1').hidden = document.querySelector('p').hidden = true;
  if (off('border')) canvas.style.border = 'none';
  const N = num('grid', 20, 8, 40); // cells per side
  canvas.width = canvas.height = N * CELL;

  let snake, dir, nextDir, food, score, timer, best = 0;

  function reset() {
    const m = Math.floor(N / 2);
    snake = [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }];
    dir = nextDir = null;
    score = 0;
    placeFood();
    clearInterval(timer);
    draw();
    updateInfo('Press an arrow key / swipe to start');
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateInfo(msg) {
    info.textContent = `Score: ${score} · Best: ${best} · ${msg}`;
  }

  function start() {
    clearInterval(timer);
    timer = setInterval(tick, SPEED);
  }

  function setDir(d) {
    if (dir && d.x === -dir.x && d.y === -dir.y) return;
    if (!dir) start();
    nextDir = d;
    if (!dir) dir = d;
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    if (hitWall || snake.some(s => s.x === head.x && s.y === head.y)) {
      clearInterval(timer);
      best = Math.max(best, score);
      updateInfo('Game over – press Space / tap to retry');
      dir = nextDir = null;
      over = true;
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      placeFood();
      updateInfo('');
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = FOOD_COLOR;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = SNAKE_COLOR;
    snake.forEach((s, i) => {
      ctx.globalAlpha = i === 0 ? 1 : 0.8;
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    ctx.globalAlpha = 1;
  }

  let over = false;
  const KEYS = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
  };

  function control(d) {
    if (over) { over = false; reset(); }
    setDir(d);
  }

  addEventListener('keydown', e => {
    if (e.key === ' ' && over) { over = false; reset(); e.preventDefault(); return; }
    const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (d) { e.preventDefault(); control(d); }
  });

  // Swipe controls; a tap restarts after game over
  let t0 = null;
  addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
  addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (over) { over = false; reset(); } return; }
    control(Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) });
  });

  reset();
</script>
</body>
</html>
